<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRE .vxp Web Emulator</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
        }
        .controls {
            margin: 20px 0;
        }
        input[type="file"] {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        canvas { 
            background: #000000; 
            border: 2px solid #333333; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #status {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>MRE .vxp Web Emulator</h1>
    <p>Select a MediaTek MRE <code>.vxp</code> app or game to run in WebAssembly.</p>

    <div class="controls">
        <input type="file" id="vxpInput" accept=".vxp">
    </div>

    <canvas id="canvas" width="240" height="320" tabindex="1"></canvas>
    <div id="status">Initializing...</div>

    <script>
        var Module = {
            canvas: (function() {
                return document.getElementById('canvas');
            })(),
            onRuntimeInitialized: function() {
                document.getElementById('status').innerText = "Wasm Engine Ready. Load a .vxp file.";
            }
        };

        // Fallback file list auto-loader
        const possibleCores = ['mre_core.js', 'mre.js', 'exen_core.js', 'mrp_core.js'];
        let loaded = false;

        possibleCores.forEach(core => {
            if (loaded) return;
            let script = document.createElement('script');
            script.src = core;
            script.onload = () => {
                loaded = true;
                console.log('Successfully loaded Wasm JS glue:', core);
            };
            document.body.appendChild(script);
        });

        document.getElementById('vxpInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Loading " + file.name + "...";

            var reader = new FileReader();
            reader.onload = function(evt) {
                var arrayBuffer = evt.target.result;
                var uint8Array = new Uint8Array(arrayBuffer);

                if (typeof FS !== 'undefined') {
                    FS.writeFile('/app.vxp', uint8Array);
                    document.getElementById('status').innerText = "Running " + file.name;

                    if (typeof Module._run_vxp === 'function') Module._run_vxp();
                    else if (typeof Module._main === 'function') Module._main();
                    else if (typeof callMain === 'function') callMain(['/app.vxp']);
                } else {
                    document.getElementById('status').innerText = "Error: FS Virtual File System not attached.";
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
