<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRE .vxp Mobile Emulator</title>
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }

        /* Mobile Device Frame */
        .phone-body {
            width: 320px;
            background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
            border: 4px solid #444;
            border-radius: 35px;
            padding: 20px 15px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .phone-header {
            width: 60px;
            height: 6px;
            background: #111;
            border-radius: 3px;
            margin: 0 auto 15px auto;
        }

        canvas { 
            background: #000; 
            border: 3px solid #111; 
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            width: 240px;
            height: 320px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Mobile Keypad Layout */
        .keypad {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 0 10px;
        }

        .btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px 0;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 3px 0 #111;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #111;
            background: #444;
        }

        .btn-action { background: #1b4d3e; border-color: #2e7d66; }
        .btn-call { background: #1e5622; }
        .btn-end { background: #7a1c1c; }

        /* On-Screen Console Output */
        .console-container {
            width: 90%;
            max-width: 600px;
            margin: 25px auto 0 auto;
            text-align: left;
        }

        #consoleLog {
            background: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            height: 120px;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .controls { margin-bottom: 15px; }
        input[type="file"] {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>MRE .vxp Mobile Emulator</h2>

    <div class="controls">
        <input type="file" id="vxpInput" accept=".vxp">
    </div>

    <div class="phone-body">
        <div class="phone-header"></div>
        <canvas id="canvas" width="240" height="320" tabindex="1"></canvas>
        <div id="status" style="color:#aaa; font-size:12px; margin: 8px 0;">Engine Loading...</div>

        <div class="keypad">
            <button class="btn btn-action" onmousedown="sendKey(1, 1)" onmouseup="sendKey(1, 0)">LSK</button>
            <button class="btn btn-action" onmousedown="sendKey(14, 1)" onmouseup="sendKey(14, 0)">UP</button>
            <button class="btn btn-action" onmousedown="sendKey(2, 1)" onmouseup="sendKey(2, 0)">RSK</button>

            <button class="btn btn-action" onmousedown="sendKey(16, 1)" onmouseup="sendKey(16, 0)">LEFT</button>
            <button class="btn btn-action" onmousedown="sendKey(13, 1)" onmouseup="sendKey(13, 0)">OK</button>
            <button class="btn btn-action" onmousedown="sendKey(17, 1)" onmouseup="sendKey(17, 0)">RIGHT</button>

            <button class="btn btn-call" onmousedown="sendKey(3, 1)" onmouseup="sendKey(3, 0)">CALL</button>
            <button class="btn btn-action" onmousedown="sendKey(15, 1)" onmouseup="sendKey(15, 0)">DOWN</button>
            <button class="btn btn-end" onmousedown="sendKey(4, 1)" onmouseup="sendKey(4, 0)">END</button>

            <button class="btn" onmousedown="sendKey(48, 1)" onmouseup="sendKey(48, 0)">1</button>
            <button class="btn" onmousedown="sendKey(49, 1)" onmouseup="sendKey(49, 0)">2</button>
            <button class="btn" onmousedown="sendKey(50, 1)" onmouseup="sendKey(50, 0)">3</button>

            <button class="btn" onmousedown="sendKey(51, 1)" onmouseup="sendKey(51, 0)">4</button>
            <button class="btn" onmousedown="sendKey(52, 1)" onmouseup="sendKey(52, 0)">5</button>
            <button class="btn" onmousedown="sendKey(53, 1)" onmouseup="sendKey(53, 0)">6</button>

            <button class="btn" onmousedown="sendKey(54, 1)" onmouseup="sendKey(54, 0)">7</button>
            <button class="btn" onmousedown="sendKey(55, 1)" onmouseup="sendKey(55, 0)">8</button>
            <button class="btn" onmousedown="sendKey(56, 1)" onmouseup="sendKey(56, 0)">9</button>

            <button class="btn" onmousedown="sendKey(42, 1)" onmouseup="sendKey(42, 0)">*</button>
            <button class="btn" onmousedown="sendKey(47, 1)" onmouseup="sendKey(47, 0)">0</button>
            <button class="btn" onmousedown="sendKey(35, 1)" onmouseup="sendKey(35, 0)">#</button>
        </div>
    </div>

    <div class="console-container">
        <strong>Live Console Output:</strong>
        <div id="consoleLog"></div>
    </div>

    <script>
        // Redirect stdout/stderr to embedded web console
        function logToWebConsole(text) {
            var el = document.getElementById('consoleLog');
            if (el) {
                el.innerText += text + "\n";
                el.scrollTop = el.scrollHeight;
            }
        }

        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            print: function(text) { console.log(text); logToWebConsole("[LOG] " + text); },
            printErr: function(text) { console.error(text); logToWebConsole("[ERR] " + text); },
            onRuntimeInitialized: function() {
                var statusEl = document.getElementById('status');
                if (statusEl) statusEl.innerText = "Ready. Load a .vxp file.";
                logToWebConsole("WebAssembly core initialized successfully.");
            }
        };

        // Send Keypresses to WebAssembly
        function sendKey(code, isPressed) {
            if (typeof Module._send_mre_key === 'function') {
                Module._send_mre_key(code, isPressed);
            }
        }

        // File loader logic
        document.getElementById('vxpInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Running " + file.name;
            var reader = new FileReader();
            reader.onload = function(evt) {
                var uint8Array = new Uint8Array(evt.target.result);
                if (typeof FS !== 'undefined') {
                    const filePath = '/app.vxp';
                    FS.writeFile(filePath, uint8Array);
                    logToWebConsole("Mounted " + file.name + " to virtual FS.");

                    if (typeof Module._run_vxp_app === 'function') {
                        Module.ccall('run_vxp_app', 'number', ['string'], [filePath]);
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Keyboard bindings (Arrow keys + Enter + Numpad)
        window.addEventListener('keydown', function(e) {
            if (e.key === "ArrowUp") sendKey(14, 1);
            if (e.key === "ArrowDown") sendKey(15, 1);
            if (e.key === "ArrowLeft") sendKey(16, 1);
            if (e.key === "ArrowRight") sendKey(17, 1);
            if (e.key === "Enter") sendKey(13, 1);
        });

        window.addEventListener('keyup', function(e) {
            if (e.key === "ArrowUp") sendKey(14, 0);
            if (e.key === "ArrowDown") sendKey(15, 0);
            if (e.key === "ArrowLeft") sendKey(16, 0);
            if (e.key === "ArrowRight") sendKey(17, 0);
            if (e.key === "Enter") sendKey(13, 0);
        });
    </script>

    <script src="mre_core.js"></script>
</body>
</html>
