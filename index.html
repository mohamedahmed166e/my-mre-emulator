<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRE .vxp Web Emulator</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
        }
        .controls { margin: 20px 0; }
        input[type="file"] {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        canvas { 
            background: #000000; 
            border: 2px solid #333333; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
        #status { color: #aaa; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>MRE .vxp Web Emulator</h1>
    <p>Select a MediaTek MRE .vxp app or game to run in WebAssembly.</p>

    <div class="controls">
        <input type="file" id="vxpInput" accept=".vxp">
    </div>

    <canvas id="canvas" width="240" height="320" tabindex="1"></canvas>

    <div id="status">Loading Wasm Engine...</div>

    <script>
        var Module = {
            canvas: (function() {
                return document.getElementById('canvas');
            })(),
            onRuntimeInitialized: function() {
                console.log("Emscripten Runtime & FS Ready.");
                console.log("Exported functions available:", Object.keys(Module).filter(k => k.startsWith('_')));
                var statusEl = document.getElementById('status');
                if (statusEl) statusEl.innerText = "Wasm Engine Ready. Select a .vxp file to start.";
            }
        };

        document.getElementById('vxpInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var statusEl = document.getElementById('status');
            if (statusEl) statusEl.innerText = "Loading " + file.name + "...";

            var reader = new FileReader();
            reader.onload = function(evt) {
                var uint8Array = new Uint8Array(evt.target.result);

                if (typeof FS !== 'undefined') {
                    try {
                        FS.writeFile('/app.vxp', uint8Array);
                        console.log("File written to virtual FS at /app.vxp");
                        if (statusEl) statusEl.innerText = "Mounted " + file.name + " to virtual FS.";

                        if (typeof Module._main === 'function') {
                            Module._main(1, ['/app.vxp']);
                        } else {
                            console.log("Core loaded cleanly without auto-main crash.");
                        }
                    } catch (err) {
                        console.error("Execution Error:", err);
                        if (statusEl) statusEl.innerText = "Error: " + err.message;
                    }
                } else {
                    if (statusEl) statusEl.innerText = "Error: Virtual FS not attached.";
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>

    <script src="mre_core.js"></script>
</body>
</html>
