name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-unicorn
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build Executable
        shell: msys2 {0}
        run: |
          cd mre-core
          zig build -Doptimize=ReleaseFast --search-prefix /mingw64

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
