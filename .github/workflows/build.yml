name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Install vcpkg dependencies
        run: |
          vcpkg install sdl3:x64-windows unicorn:x64-windows

      - name: Build Executable
        run: |
          cd mre-core
          $env:LIB += ";C:\vcpkg\installed\x64-windows\lib"
          $env:INCLUDE += ";C:\vcpkg\installed\x64-windows\include"
          zig build -Doptimize=ReleaseFast --search-prefix C:\vcpkg\installed\x64-windows

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
