name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone Unicorn if missing
        run: |
          if (-not (Test-Path "mre-core/vendor/unicorn/CMakeLists.txt")) {
            git clone https://github.com/unicorn-engine/unicorn.git mre-core/vendor/unicorn
          }

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build Unicorn Engine (Static)
        run: |
          cd mre-core/vendor/unicorn
          cmake -B build -G "NMake Makefiles" -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_SAMPLES=OFF -DUNICORN_BUILD_TESTS=OFF
          cmake --build build

      - name: Flatten Library Paths for Zig
        run: |
          cd mre-core/vendor/unicorn
          New-Item -ItemType Directory -Force -Path "build"
          Get-ChildItem -Path "build" -Recurse -Filter "*.lib" | Copy-Item -Destination "build\" -Force
          Get-ChildItem -Path "build" -Recurse -Filter "*.a" | Copy-Item -Destination "build\" -Force

      - name: Build Executable with Zig
        run: |
          cd mre-core
          $unicorndir = (Resolve-Path "vendor/unicorn/build").Path
          zig build -Doptimize=ReleaseFast -p zig-out --search-prefix "$unicorndir"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
