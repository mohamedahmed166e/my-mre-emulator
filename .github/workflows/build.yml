name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Unicorn Submodule
        run: |
          mkdir -p mre-core/vendor
          cd mre-core/vendor
          if (-not (Test-Path "unicorn")) {
            git clone https://github.com/unicorn-engine/unicorn.git
          }

      - name: Install SDL3 via vcpkg
        run: |
          vcpkg install sdl3:x64-windows

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build Unicorn Dependency
        run: |
          cd mre-core/vendor/unicorn
          cmake -B build -A x64 -DUNICORN_BUILD_SAMPLES=OFF -DUNICORN_BUILD_TESTS=OFF
          cmake --build build --config Release
          New-Item -ItemType Directory -Force -Path "build\lib"
          Copy-Item -Path "build\Release\*" -Destination "build\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "build\Release\*" -Destination "build\lib\" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Executable with Zig
        run: |
          cd mre-core
          $unicorndir = (Resolve-Path "vendor/unicorn/build").Path
          $sdl3dir = "C:\vcpkg\installed\x64-windows"
          $env:LIB += ";$unicorndir;$unicorndir\lib;$sdl3dir\lib"
          $env:INCLUDE += ";$sdl3dir\include"
          zig build -Doptimize=ReleaseFast --search-prefix "$unicorndir" --search-prefix "$sdl3dir"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
