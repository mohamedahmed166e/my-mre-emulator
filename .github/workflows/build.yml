name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config

      - name: Clone Unicorn Submodule
        run: |
          mkdir -p mre-core/vendor
          if (-not (Test-Path "mre-core/vendor/unicorn/CMakeLists.txt")) {
            git clone https://github.com/unicorn-engine/unicorn.git mre-core/vendor/unicorn
          }

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build Unicorn (MinGW Static)
        shell: msys2 {0}
        run: |
          cd mre-core/vendor/unicorn
          cmake -B build -G "Ninja" -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_SAMPLES=OFF -DUNICORN_BUILD_TESTS=OFF
          cmake --build build
          cp build/libunicorn.a build/unicorn.a 2>/dev/null || true
          cp build/libunicorn.a build/libunicorn.lib 2>/dev/null || true

      - name: Build Executable with Zig
        run: |
          cd mre-core
          $unicorndir = (Resolve-Path "vendor/unicorn/build").Path
          zig build -Doptimize=ReleaseFast -p zig-out --search-prefix "$unicorndir"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
