name: Build MRE Emulator Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Build C Dependencies (Unicorn)
        run: |
          if (Test-Path "mre-core/vendor/unicorn") {
            cd mre-core/vendor/unicorn
            mkdir build -ErrorAction SilentlyContinue
            cd build
            cmake .. -A x64
            cmake --build . --config Release
          }

      - name: Build Executable
        run: |
          cd mre-core
          zig build -Doptimize=ReleaseFast

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mre-emulator-windows
          path: mre-core/zig-out/bin/
