name: Deploy WebAssembly Emulator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten Toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Make Build Script Executable
        run: chmod +x build-cores.sh

      - name: Run Build Core Script
        run: ./build-cores.sh

      - name: Prepare Web Assets Directory
        run: |
          mkdir -p dist
          # Copy generated Wasm/JS binaries and static web files
          if [ -d "web" ]; then cp -r web/* dist/; fi
          if [ -d "mre-core/zig-out" ]; then cp -r mre-core/zig-out/* dist/; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
