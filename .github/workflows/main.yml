name: Build WASM Emulator Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Compile MRE Core to WebAssembly
        run: |
          cd mre-core
          zig build-exe src/root.zig -target wasm32-freestanding -O ReleaseFast --name handyplay || zig build-exe src/main.zig -target wasm32-freestanding -O ReleaseFast --name handyplay
          cp handyplay.wasm ../

      - name: Upload Compiled WASM File
        uses: actions/upload-artifact@v4
        with:
          name: handyplay-wasm
          path: handyplay.wasm
