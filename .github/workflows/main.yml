name: Build WASM Emulator Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Zig Compiler
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Compile Core to WebAssembly
        run: |
          zig build-exe src/main.zig -target wasm32-freestanding -O ReleaseFast --name handyplay

      - name: Upload Compiled WASM File
        uses: actions/upload-artifact@v3
        with:
          name: handyplay-wasm
          path: handyplay.wasm
