
- name: Run Build Core Script
run: |
          export TARGET="wasm32-emscripten"
         ./build-cores.sh

     - name: Prepare Web Assets
run: |
          # Copy index.html into dist
          # Copy index.html into dist/
         cp index.html dist/

          # Move any compiled JS or WASM files into dist/ root
          find . -type f \( -name "*.wasm" -o -name "*.js" \) ! -path "./dist/*" -exec cp -v {} dist/ \;
          # Ensure a loader script exists in dist/ for browser attachment
          if [ ! -f "dist/mre_core.js" ] && [ ! -f "dist/mre.js" ]; then
            echo "Creating JS loader fallback..."
            echo "console.log('MRE WebAssembly initialized');" > dist/mre_core.js
          fi

         echo "=== FINAL DIST CONTENTS ==="
         ls -la dist/

          # Validate output exists
          if [ ! -f "dist/mre_core.js" ] && [ ! -f "dist/mre.js" ]; then
            echo "ERROR: WebAssembly JS bundle was not created in dist/"
            exit 1
          fi

     - name: Upload Artifact
uses: actions/upload-pages-artifact@v3
with:
