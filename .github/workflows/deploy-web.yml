name: Deploy WebAssembly Emulator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten Toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Make Build Script Executable
        run: chmod +x build-cores.sh

      - name: Run Build Core Script
        run: |
          export TARGET="wasm32-emscripten"
          ./build-cores.sh

      - name: Prepare Web Assets
        run: |
          # Copy index.html into dist
          cp index.html dist/

          # Move any compiled JS or WASM files into dist/ root
          find . -type f \( -name "*.wasm" -o -name "*.js" \) ! -path "./dist/*" -exec cp -v {} dist/ \;

          echo "=== FINAL DIST CONTENTS ==="
          ls -la dist/

          # Validate output exists
          if [ ! -f "dist/mre_core.js" ] && [ ! -f "dist/mre.js" ]; then
            echo "ERROR: WebAssembly JS bundle was not created in dist/"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
