name: Deploy WebAssembly Emulator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Missing minimp3 Headers
        run: |
          mkdir -p mre-core/core
          curl -sSL "https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h" -o mre-core/core/minimp3.h
          curl -sSL "https://raw.githubusercontent.com/lieff/minimp3/master/minimp3_ex.h" -o mre-core/core/minimp3_ex.h
          echo "=== VERIFYING MINIMP3 HEADERS ==="
          ls -la mre-core/core/minimp3*

      - name: Setup Emscripten Toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Make Build Script Executable
        run: chmod +x build-cores.sh

      - name: Run Build Core Script
        run: ./build-cores.sh

      - name: Prepare Web Assets
        run: |
          cp index.html dist/
          echo "=== DIST ASSETS FOR DEPLOYMENT ==="
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
