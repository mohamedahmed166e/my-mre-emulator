name: Deploy WebAssembly Emulator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten Toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.0

      - name: Make Build Script Executable
        run: chmod +x build-cores.sh

      - name: Run Build Core Script (Wasm Mode)
        run: |
          emconfigure ./build-cores.sh || true

      - name: Prepare Web Assets
        run: |
          mkdir -p dist
          
          # Copy root index.html into dist
          cp index.html dist/
          
          # Search entire repo for all compiled .js and .wasm files and copy to dist root
          find . -type f \( -name "*.wasm" -o -name "*.js" \) ! -path "./dist/*" -exec cp {} dist/ \;
          
          # List files in dist to debug artifacts in workflow logs
          echo "=== DIST CONTENTS ==="
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
